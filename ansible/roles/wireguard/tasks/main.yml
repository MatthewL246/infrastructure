- name: Install WireGuard tools
  ansible.builtin.apt:
    name:
      - wireguard-tools
    state: present

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=,o=

- name: Check if saved private key exists
  ansible.builtin.stat:
    path: /etc/wireguard/wg0.key
  register: wg0_key_stat

- name: Generate and store new private key
  when: not wg0_key_stat.stat.exists
  block:
    - name: Generate new private key
      ansible.builtin.command:
        cmd: wg genkey
      register: new_wg0_key

    - name: Store private key
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.key
        content: "{{ new_wg0_key.stdout }}"
        owner: root
        group: root
        mode: u=r,g=,o=

- name: Read private key
  ansible.builtin.slurp:
    path: /etc/wireguard/wg0.key
  register: wg0_private_key_base64

- name: Set private key fact
  ansible.builtin.set_fact:
    wg0_private_key: "{{ wg0_private_key_base64.content | b64decode }}"

# TODO:add support for peers
- name: Configure wg0 interface
  vars:
    ip_address_number: 1
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: o=rw,g=,o=
  notify:
    - Reload wg0

- name: Start and enable wg-quick for interface wg0
  ansible.builtin.service:
    name: wg-quick@wg0
    state: started
    enabled: yes
